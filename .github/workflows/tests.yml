name: WAVEFORMING validation

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libportaudio2
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate GLSL shader source
        run: |
          python -m pip install moderngl glcontext
          python - <<'PY'
          from engine.visual.canvas import FRAGMENT_SHADER, VERTEX_SHADER
          import moderngl
          context = moderngl.create_standalone_context(require=330, backend="egl")
          program = context.program(vertex_shader=VERTEX_SHADER, fragment_shader=FRAGMENT_SHADER)
          assert "uProcA" in program
          assert "uProcEntropy" in program
          program.release()
          context.release()
          PY
      - name: Compile application
        run: python -m compileall -q app engine main.py
      - name: Smoke-test structured XM to visual instrument
        run: |
          python - <<'PY'
          import struct
          import tempfile
          from pathlib import Path

          from engine.tracker.xm import load_xm, tracker_packet_at
          from engine.visual.generators import GeneratorBank, GeneratorSettings
          from engine.visual.layers import VisualLayer
          from engine.visual.compositor import VisualCompositor
          from engine.visual.assets import AssetCatalog
          from engine.visual.scene import (
              VisualObject, VisualRelationship, VisualScene, VisualScore, VisualScoreCue,
              crossed_score_cues,
          )
          from engine.visual.project import VisualProject
          from engine.visual.scene_pair import (
              ScenePairRenderContract, blend_scene_pair_frames,
              build_object_morph_state,
          )
          from engine.visual.transitions import (
              SceneTransition, SceneTransitionController,
          )
          from engine.visual.vector_geometry import (
              interpolate_vector_paths, render_vector_paths,
          )
          from PIL import Image
          from types import MethodType
          import json

          # A tiny valid XM: two tracker channels, one note, one named sample.
          header = bytearray(336)
          header[:17] = b"Extended Module: "
          header[17:37] = b"CI channel smoke".ljust(20, b"\0")
          header[37] = 0x1A
          header[38:58] = b"MilkyTracker".ljust(20, b"\0")
          struct.pack_into("<H", header, 58, 0x0104)
          struct.pack_into("<I", header, 60, 276)
          struct.pack_into("<8H", header, 64, 1, 0, 2, 1, 1, 1, 6, 125)
          header[80] = 0
          events = bytes((49, 1, 0, 0, 0, 0x80))
          pattern = struct.pack("<IBHH", 9, 0, 1, len(events)) + events
          instrument = bytearray(33)
          struct.pack_into("<I", instrument, 0, 33)
          instrument[4:26] = b"Smoke Instrument".ljust(22, b"\0")
          struct.pack_into("<H", instrument, 27, 1)
          struct.pack_into("<I", instrument, 29, 40)
          sample_header = bytearray(40)
          struct.pack_into("<I", sample_header, 0, 2)
          sample_header[18:40] = b"smoke-sample.wav".ljust(22, b"\0")
          with tempfile.TemporaryDirectory() as folder:
              module_path = Path(folder) / "smoke.xm"
              module_path.write_bytes(
                  bytes(header) + pattern + bytes(instrument)
                  + bytes(sample_header) + b"\0\0"
              )
              module = load_xm(module_path)
              score = module.visual_data()
              assert module.channels == 2
              assert module.instrument_count == 1
              assert module.instruments[0].sample_names == ("smoke-sample.wav",)
              assert len(score["channel_profiles"]) == 2
              assert score["channel_profiles"][0]["sample_name"] == "smoke-sample.wav"
              assert score["channel_profiles"][0]["note_count"] == 1
              packet = tracker_packet_at(score, 0.0)
              assert packet is not None
              assert len(packet["channel_states"]) == 2
              assert packet["channel_states"][0]["held_note"] == 49
              assert packet["channel_states"][0]["sample_name"] == "smoke-sample.wav"
              image = GeneratorBank().render(
                  "TRACKER ENSEMBLE",
                  {"tracker_cue": packet},
                  0.0,
                  (320, 240),
                  GeneratorSettings(),
              )
              assert image.size == (320, 240)
              assert image.getchannel("A").getbbox() is not None

              layers = [
                  VisualLayer(name="XM VOICES", generator="TRACKER ENSEMBLE"),
                  VisualLayer(name="ENVIRONMENT", generator="GEOMETRIC PLATE"),
              ]
              scene = VisualScene(name="SMOKE SCENE")
              scene.synchronize_layers(layers, score)
              assert len(scene.objects) == 2
              ensemble = next(
                  obj for obj in scene.objects
                  if obj.metadata.get("generator") == "TRACKER ENSEMBLE"
              )
              assert len([
                  binding for binding in ensemble.source_bindings
                  if binding.get("type") == "tracker_channel"
              ]) == 2
              original_object_id = ensemble.object_id
              layers[0].opacity = 0.72
              scene.synchronize_layers(layers, score)
              ensemble = next(
                  obj for obj in scene.objects
                  if obj.layer_id == layers[0].layer_id
              )
              assert ensemble.object_id == original_object_id
              scene.synchronize_layers(list(reversed(layers)), score)
              assert scene.layer_order == [
                  layers[1].layer_id, layers[0].layer_id
              ]
              scene_data = json.loads(json.dumps(scene.to_dict()))
              restored_scene = VisualScene.from_dict(scene_data)
              assert restored_scene.layer_order == scene.layer_order
              assert next(
                  obj for obj in restored_scene.objects
                  if obj.layer_id == layers[0].layer_id
              ).object_id == original_object_id
              ordered = VisualCompositor._order_layers_from_scene(
                  layers, restored_scene.to_dict()
              )
              assert [item.layer_id for item in ordered] == scene.layer_order

              visual_score = VisualScore.from_tracker_data(
                  score, scene.scene_id, module.duration
              )
              assert len(visual_score.cues) == len(score["cues"])
              restored_score = VisualScore.from_dict(
                  json.loads(json.dumps(visual_score.to_dict()))
              )
              assert restored_score.source_score_id == score["score_id"]
              assert restored_score.scene_ids == [scene.scene_id]
              assert restored_score.cues[0].cue_type == "scene_open" or (
                  restored_score.cues[0].cue_type in ("pattern_enter", "pattern_return")
              )

              # The live cue scanner treats a backward playhead jump as a loop.
              cycle_cues = [
                  VisualScoreCue(cue_id="cycle-start", time=0.0),
                  VisualScoreCue(cue_id="cycle-next", time=0.25),
                  VisualScoreCue(cue_id="cycle-later", time=1.0),
              ]
              assert [
                  cue.cue_id for cue in crossed_score_cues(
                      cycle_cues, 32.0, 0.5
                  )
              ] == ["cycle-start", "cycle-next"]
              assert [
                  cue.cue_id for cue in crossed_score_cues(
                      cycle_cues, 0.1, 0.5
                  )
              ] == ["cycle-next"]

              # Legacy projects without graph data are reconstructed from layers.
              migrated_scene = VisualScene()
              migrated_scene.synchronize_layers(layers, score)
              assert len(migrated_scene.objects) == len(layers)

              # Propose first, then commit: proposal must not mutate scene state.
              outgoing = VisualScene(scene_id="scene-outgoing", name="OUTGOING")
              incoming = VisualScene(
                  scene_id="scene-incoming", name="INCOMING", state="INACTIVE"
              )
              controller = SceneTransitionController()
              controller.register_scene(outgoing, active=True)
              controller.register_scene(incoming)
              transition = SceneTransition(
                  source_scene_id=outgoing.scene_id,
                  target_scene_id=incoming.scene_id,
                  family="dissolve",
                  duration_seconds=4.0,
                  easing="smoothstep",
                  preparation_fraction=0.15,
                  transformation_fraction=0.70,
                  interruption_policy="cancel",
                  outgoing_policy="archive",
              )
              proposal = controller.propose(
                  transition, proposed_at=0.0, rationale="CI lifecycle smoke"
              )
              assert outgoing.state == "ACTIVE"
              assert incoming.state == "INACTIVE"
              start = controller.commit(proposal.proposal_id, start_time=10.0)
              assert start["phase"] == "PREPARATION"
              middle = controller.sample(12.0)
              assert middle["phase"] == "TRANSFORMATION"
              end = controller.sample(14.0)
              assert end["completed"] is True
              assert outgoing.state == "ARCHIVED"
              assert incoming.state == "ACTIVE"
              assert controller.active_scene_id == incoming.scene_id

              # Cancellation restores the outgoing scene and prepares the target.
              cancel_target = VisualScene(
                  scene_id="scene-cancel-target", name="CANCEL TARGET",
                  state="INACTIVE",
              )
              controller.register_scene(cancel_target)
              cancel_transition = SceneTransition(
                  source_scene_id=incoming.scene_id,
                  target_scene_id=cancel_target.scene_id,
                  duration_seconds=3.0,
                  interruption_policy="cancel",
              )
              cancel_proposal = controller.propose(
                  cancel_transition, proposed_at=20.0
              )
              controller.commit(cancel_proposal.proposal_id, start_time=20.0)
              assert controller.interrupt() == "cancelled"
              assert incoming.state == "ACTIVE"
              assert cancel_target.state == "PREPARED"
              try:
                  incoming.transition_state("ARCHIVED")
                  raise AssertionError("Invalid scene state transition was accepted.")
              except ValueError:
                  pass

              # Transition contracts are plain JSON-compatible project data.
              round_trip = SceneTransition.from_dict(
                  json.loads(json.dumps(transition.to_dict()))
              )
              assert round_trip.transition_id == transition.transition_id
              assert round_trip.family == "dissolve"

              # M13: a project retains independent scene layers and stable identities.
              object_ids = [item.object_id for item in restored_scene.objects]
              restored_scene.relationships = [
                  VisualRelationship(
                      source_object_id=object_ids[0],
                      target_object_id=object_ids[1],
                      kind="accompanies",
                  )
              ]
              restored_scene.attention_plan = {
                  "primary": object_ids[0],
                  "secondary": [object_ids[1]],
                  "background": [],
              }
              visual_project = VisualProject.from_legacy(
                  restored_scene, [layer.to_dict() for layer in layers]
              )
              duplicate = visual_project.duplicate_scene(restored_scene.scene_id)
              duplicate_object_ids = {item.object_id for item in duplicate.objects}
              assert duplicate.attention_plan["primary"] in duplicate_object_ids
              assert set(duplicate.attention_plan["secondary"]).issubset(
                  duplicate_object_ids
              )
              assert all(
                  rel.source_object_id in duplicate_object_ids
                  and rel.target_object_id in duplicate_object_ids
                  for rel in duplicate.relationships
              )
              assert duplicate.relationships[0].relationship_id != (
                  restored_scene.relationships[0].relationship_id
              )
              original_layer_ids = {
                  item["layer_id"]
                  for item in visual_project.layers_for_scene(restored_scene.scene_id)
              }
              duplicate_layer_ids = {
                  item["layer_id"]
                  for item in visual_project.layers_for_scene(duplicate.scene_id)
              }
              assert original_layer_ids.isdisjoint(duplicate_layer_ids)
              original_object_ids = {
                  item.object_id for item in restored_scene.objects
              }
              duplicate_object_ids = {
                  item.object_id for item in duplicate.objects
              }
              assert original_object_ids.isdisjoint(duplicate_object_ids)
              assert duplicate.metadata["duplicated_from_scene_id"] == restored_scene.scene_id
              assert all(
                  item.layer_id in duplicate_layer_ids
                  for item in duplicate.objects
              )

              # Archived objects without active layer records must also receive
              # unique layer identities in a duplicated scene.
              archived_scene = VisualScene(name="ARCHIVED SOURCE")
              archived_scene.synchronize_layers(layers, score)
              archived_layer_id = layers[0].layer_id
              archived_scene.synchronize_layers(layers[1:], score)
              archived_object = next(
                  item for item in archived_scene.objects
                  if item.layer_id == archived_layer_id
              )
              assert archived_object.lifecycle == "ARCHIVED"
              archived_project = VisualProject.from_legacy(
                  archived_scene, [layers[1].to_dict()]
              )
              archived_copy = archived_project.duplicate_scene()
              archived_source_ids = {
                  item.layer_id for item in archived_scene.objects
              }
              archived_copy_ids = {
                  item.layer_id for item in archived_copy.objects
              }
              assert archived_source_ids.isdisjoint(archived_copy_ids)

              # Empty layer snapshots remain empty across serialization.
              empty_scene = VisualScene(
                  scene_id="scene-empty", name="EMPTY", state="INACTIVE"
              )
              visual_project.register_scene(empty_scene, [])
              empty_round_trip = VisualProject.from_dict(
                  json.loads(json.dumps(visual_project.to_dict()))
              )
              assert empty_round_trip.layers_for_scene(empty_scene.scene_id) == []

              route = visual_project.set_cue_route(
                  visual_score.cues[0].cue_id,
                  duplicate.scene_id,
                  source_scene_id=restored_scene.scene_id,
                  family="dissolve",
                  duration_seconds=1.25,
              )
              assert route["target_scene_id"] == duplicate.scene_id
              assert visual_project.route_for_cue(
                  visual_score.cues[0].cue_id
              )["family"] == "dissolve"

              project_round_trip = VisualProject.from_dict(
                  json.loads(json.dumps(visual_project.to_dict()))
              )
              assert project_round_trip.active_scene_id == restored_scene.scene_id
              assert len(project_round_trip.scenes) == 3
              assert project_round_trip.layers_for_scene(
                  duplicate.scene_id
              ) == visual_project.layers_for_scene(duplicate.scene_id)
              assert project_round_trip.route_for_cue(
                  visual_score.cues[0].cue_id
              )["target_scene_id"] == duplicate.scene_id

              selected = project_round_trip.select_scene(duplicate.scene_id)
              assert selected.state == "ACTIVE"
              assert project_round_trip.active_scene.state == "ACTIVE"
              assert project_round_trip.get_scene(
                  restored_scene.scene_id
              ).state == "HELD"

              # M14: the scene-pair contract snapshots independent scene/layer data.
              pair_out = VisualScene(
                  scene_id="pair-out", name="PAIR OUT", state="EXITING"
              )
              pair_in = VisualScene(
                  scene_id="pair-in", name="PAIR IN", state="ENTERING"
              )
              pair_project = VisualProject(
                  scenes=[pair_out, pair_in],
                  active_scene_id=pair_out.scene_id,
                  layer_snapshots={
                      pair_out.scene_id: [layers[0].to_dict()],
                      pair_in.scene_id: [layers[1].to_dict()],
                  },
              )
              pair_sample = {
                  "transition_id": "transition-smoke",
                  "source_scene_id": pair_out.scene_id,
                  "target_scene_id": pair_in.scene_id,
                  "family": "dissolve",
                  "phase": "TRANSFORMATION",
                  "progress": 0.5,
                  "eased_progress": 0.5,
                  "outgoing_weight": 0.5,
                  "incoming_weight": 0.5,
                  "duration_seconds": 2.0,
                  "completed": False,
              }
              pair_contract = ScenePairRenderContract.from_project(
                  pair_project, pair_sample
              )
              pair_round_trip = ScenePairRenderContract.from_dict(
                  json.loads(json.dumps(pair_contract.to_dict()))
              )
              assert pair_round_trip.outgoing["scene"]["scene_id"] == "pair-out"
              assert pair_round_trip.incoming["scene"]["scene_id"] == "pair-in"
              assert pair_round_trip.outgoing["layers"][0]["layer_id"] == layers[0].layer_id
              assert pair_round_trip.incoming["layers"][0]["layer_id"] == layers[1].layer_id
              assert pair_round_trip.render_mode == "crossfade"
              assert pair_round_trip.path_correspondence == pair_contract.path_correspondence

              black = Image.new("RGBA", (4, 4), (0, 0, 0, 255))
              white = Image.new("RGBA", (4, 4), (255, 255, 255, 255))
              start_contract = ScenePairRenderContract.from_dict({
                  **pair_contract.to_dict(),
                  "incoming_weight": 0.0,
                  "outgoing_weight": 1.0,
                  "progress": 0.0,
                  "eased_progress": 0.0,
              })
              middle_frame = blend_scene_pair_frames(
                  black, white, pair_round_trip
              )
              start_frame = blend_scene_pair_frames(
                  black, white, start_contract
              )
              assert start_frame.getpixel((0, 0)) == (0, 0, 0, 255)
              assert middle_frame.getpixel((0, 0)) == (127, 127, 127, 255)
              end_contract = ScenePairRenderContract.from_dict({
                  **pair_contract.to_dict(),
                  "incoming_weight": 1.0,
                  "outgoing_weight": 0.0,
                  "progress": 1.0,
                  "eased_progress": 1.0,
                  "completed": True,
              })
              end_frame = blend_scene_pair_frames(
                  black, white, end_contract
              )
              assert end_frame.getpixel((0, 0)) == (255, 255, 255, 255)

              # Exercise the compositor's two-render orchestration and final blend.
              pair_compositor = VisualCompositor.__new__(VisualCompositor)
              pair_compositor.size = (4, 4)
              pair_compositor._feedback = None
              pair_compositor._last_time = None
              pair_compositor._frame_cache = {"No guide": (0, 0, 4, 4)}
              pair_compositor.generators = GeneratorBank()
              pair_compositor.last_profile = {}
              rendered_scene_ids = []
              def fake_scene_render(
                  self, packet, seconds, layers=None, settings=None,
                  screen="No guide", feedback_enabled=False,
                  feedback_amount=0.35, feedback_decay=0.90,
                  feedback_shift=0.0, visual_scene=None, vector_overrides=None,
              ):
                  self.last_profile = {
                      "scene_ms": 0.5, "layer_count": len(layers or []),
                      "layers": [], "backend": "CI",
                  }
                  rendered_scene_ids.append(visual_scene["scene_id"])
                  color = (
                      (0, 0, 0, 255)
                      if visual_scene["scene_id"] == "pair-out"
                      else (255, 255, 255, 255)
                  )
                  return Image.new("RGBA", self.size, color)
              pair_compositor.render = MethodType(
                  fake_scene_render, pair_compositor
              )
              rendered_pair = pair_compositor.render_scene_pair(
                  packet={}, seconds=1.0, scene_pair=pair_round_trip
              )
              assert rendered_pair.getpixel((0, 0)) == (127, 127, 127, 255)
              assert pair_compositor.last_profile["backend"] == "CPU_SCENE_PAIR"
              assert pair_compositor.last_profile["scene_pair"]["transition_id"] == (
                  "transition-smoke"
              )
              assert rendered_scene_ids == ["pair-out", "pair-in"]

              # M14 object-aware morph: explicit identity correspondence yields
              # one interpolated renderer object; unmatched objects fade separately.
              morph_out_layer = VisualLayer(
                  name="MORPH OUT", generator="GEOMETRIC PLATE",
                  x_offset=-0.5, scale=0.8, rotation=350.0, opacity=1.0,
              )
              morph_in_layer = VisualLayer(
                  name="MORPH IN", generator="GEOMETRIC PLATE",
                  x_offset=0.5, scale=1.2, rotation=10.0, opacity=0.6,
              )
              source_only_layer = VisualLayer(
                  name="SOURCE ONLY", generator="GEOMETRIC PLATE", opacity=0.6,
              )
              target_only_layer = VisualLayer(
                  name="TARGET ONLY", generator="GEOMETRIC PLATE", opacity=0.8,
              )
              morph_out_object = VisualObject.from_layer(morph_out_layer)
              morph_in_object = VisualObject.from_layer(morph_in_layer)
              source_only_object = VisualObject.from_layer(source_only_layer)
              target_only_object = VisualObject.from_layer(target_only_layer)
              morph_out_scene = VisualScene(
                  scene_id="morph-out", name="MORPH OUT",
                  objects=[morph_out_object, source_only_object],
                  layer_order=[morph_out_layer.layer_id, source_only_layer.layer_id],
              )
              morph_in_scene = VisualScene(
                  scene_id="morph-in", name="MORPH IN",
                  objects=[morph_in_object, target_only_object],
                  layer_order=[morph_in_layer.layer_id, target_only_layer.layer_id],
              )
              morph_mapping = [{
                  "source_object_id": morph_out_object.object_id,
                  "target_object_id": morph_in_object.object_id,
              }]
              morph_project = VisualProject(
                  scenes=[morph_out_scene, morph_in_scene],
                  active_scene_id=morph_out_scene.scene_id,
                  layer_snapshots={
                      morph_out_scene.scene_id: [
                          morph_out_layer.to_dict(), source_only_layer.to_dict(),
                      ],
                      morph_in_scene.scene_id: [
                          morph_in_layer.to_dict(), target_only_layer.to_dict(),
                      ],
                  },
              )
              morph_sample = {
                  **pair_sample,
                  "transition_id": "transition-object-morph",
                  "source_scene_id": morph_out_scene.scene_id,
                  "target_scene_id": morph_in_scene.scene_id,
                  "family": "morph",
                  "object_correspondence": morph_mapping,
              }
              morph_contract = ScenePairRenderContract.from_project(
                  morph_project, morph_sample
              )
              assert morph_contract.render_mode == "object_morph"
              assert morph_contract.object_correspondence[0]["kind"] == "explicit"
              morph_scene, morph_records = build_object_morph_state(morph_contract)
              morph_by_id = {item["layer_id"]: item for item in morph_records}
              matched = morph_by_id[morph_out_layer.layer_id]
              assert abs(matched["x_offset"]) < 1e-6
              assert abs(matched["scale"] - 1.0) < 1e-6
              assert abs(matched["rotation"] - 360.0) < 1e-6
              assert abs(matched["opacity"] - 0.8) < 1e-6
              assert morph_in_layer.layer_id not in morph_by_id
              assert abs(morph_by_id[source_only_layer.layer_id]["opacity"] - 0.3) < 1e-6
              assert abs(morph_by_id[target_only_layer.layer_id]["opacity"] - 0.4) < 1e-6
              assert morph_scene["scene_id"] == "morph:morph-out:morph-in"
              assert set(morph_scene["layer_order"]) == set(morph_by_id)

              rendered_scene_ids.clear()
              morph_rendered = pair_compositor.render_scene_pair(
                  packet={}, seconds=1.0, scene_pair=morph_contract
              )
              assert morph_rendered.size == (4, 4)
              assert rendered_scene_ids == ["morph:morph-out:morph-in"]

              # Shared object IDs are unambiguous identity matches even when
              # no explicit pair list was supplied.
              shared_out = VisualObject.from_layer(morph_out_layer)
              shared_in = VisualObject.from_layer(morph_in_layer)
              shared_in.object_id = shared_out.object_id
              identity_contract = ScenePairRenderContract.from_dict({
                  **morph_contract.to_dict(),
                  "outgoing": {
                      **morph_contract.outgoing,
                      "scene": {
                          **morph_contract.outgoing["scene"],
                          "objects": [shared_out.to_dict()],
                      },
                  },
                  "incoming": {
                      **morph_contract.incoming,
                      "scene": {
                          **morph_contract.incoming["scene"],
                          "objects": [shared_in.to_dict()],
                      },
                  },
                  "object_correspondence": [],
              })
              assert identity_contract.object_correspondence == [{
                  "source_object_id": shared_out.object_id,
                  "target_object_id": shared_out.object_id,
                  "kind": "identity",
              }]

              # Duplicated project scenes change object IDs but retain lineage.
              lineage_source = VisualObject.from_layer(morph_out_layer)
              lineage_target = VisualObject.from_layer(morph_in_layer)
              lineage_target.lineage = [lineage_source.object_id]
              lineage_contract = ScenePairRenderContract.from_dict({
                  **morph_contract.to_dict(),
                  "outgoing": {
                      **morph_contract.outgoing,
                      "scene": {
                          **morph_contract.outgoing["scene"],
                          "objects": [lineage_source.to_dict()],
                      },
                  },
                  "incoming": {
                      **morph_contract.incoming,
                      "scene": {
                          **morph_contract.incoming["scene"],
                          "objects": [lineage_target.to_dict()],
                      },
                  },
                  "object_correspondence": [],
              })
              assert lineage_contract.object_correspondence == [{
                  "source_object_id": lineage_source.object_id,
                  "target_object_id": lineage_target.object_id,
                  "kind": "lineage",
              }]

              # Generator-aware geometry morphing: Phase Orbit paths are matched
              # to Mobius surface rows, resampled and deformed before rasterization.
              vector_source_layer = VisualLayer(
                  name="VECTOR SOURCE", generator="PHASE ORBIT",
              )
              vector_target_layer = VisualLayer(
                  name="VECTOR TARGET", generator="MOBIUS FIELD",
              )
              vector_source_object = VisualObject.from_layer(vector_source_layer)
              vector_target_object = VisualObject.from_layer(vector_target_layer)
              vector_source_scene = VisualScene(
                  scene_id="vector-source", name="VECTOR SOURCE",
                  objects=[vector_source_object],
                  layer_order=[vector_source_layer.layer_id],
              )
              vector_target_scene = VisualScene(
                  scene_id="vector-target", name="VECTOR TARGET",
                  objects=[vector_target_object],
                  layer_order=[vector_target_layer.layer_id],
              )
              vector_project = VisualProject(
                  scenes=[vector_source_scene, vector_target_scene],
                  active_scene_id=vector_source_scene.scene_id,
                  layer_snapshots={
                      vector_source_scene.scene_id: [vector_source_layer.to_dict()],
                      vector_target_scene.scene_id: [vector_target_layer.to_dict()],
                  },
              )
              vector_sample = {
                  **pair_sample,
                  "transition_id": "transition-vector-morph",
                  "source_scene_id": vector_source_scene.scene_id,
                  "target_scene_id": vector_target_scene.scene_id,
                  "family": "morph",
                  "object_correspondence": [{
                      "source_object_id": vector_source_object.object_id,
                      "target_object_id": vector_target_object.object_id,
                  }],
                  "path_correspondence": [{
                      "source_object_id": vector_source_object.object_id,
                      "target_object_id": vector_target_object.object_id,
                      "mode": "pair",
                      "source_path_ids": ["orbit:0"],
                      "target_path_ids": ["mobius:row:0"],
                      "anchors": [
                          {"source_t": 0.0, "target_t": 0.0},
                          {"source_t": 0.35, "target_t": 0.62},
                          {"source_t": 1.0, "target_t": 1.0},
                      ],
                  }],
              }
              vector_contract = ScenePairRenderContract.from_project(
                  vector_project, vector_sample
              )
              vector_compositor = VisualCompositor(
                  AssetCatalog(Path(".")), render_size=(96, 72)
              )
              vector_frame = vector_compositor.render_scene_pair(
                  packet={}, seconds=0.75, scene_pair=vector_contract
              )
              assert vector_frame.size == (96, 72)
              assert vector_compositor.last_profile["scene_pair"]["vector_morph_object_count"] == 1
              assert vector_compositor.last_profile["scene_pair"]["vector_morph_path_count"] > 0
              assert vector_compositor.last_profile["scene_pair"]["authored_path_map_count"] == 1
              assert vector_compositor.last_profile["scene_pair"]["split_path_map_count"] == 0
              assert vector_compositor.last_profile["scene_pair"]["merge_path_map_count"] == 0

              path_bank = GeneratorBank()
              vector_generator_names = (
                  "PHASE ORBIT", "PHASE LATTICE", "GEOMETRIC FIELD",
                  "GEOMETRIC PLATE", "AXONOMETRIC FIELD", "POLYHEDRAL FIELD",
                  "MOBIUS FIELD",
              )
              for generator_name in vector_generator_names:
                  geometry = path_bank.vector_geometry(
                      generator_name, {}, 0.0, (160, 120), GeneratorSettings()
                  )
                  assert geometry and all(
                      len(path.get("points", [])) >= 2 for path in geometry
                  )
              assert path_bank.vector_geometry(
                  "PARTICLE FIELD", {}, 0.0, (160, 120), GeneratorSettings()
              ) is None
              source_paths = path_bank.vector_geometry(
                  "PHASE ORBIT", {}, 0.0, (320, 240), GeneratorSettings()
              )
              target_paths = path_bank.vector_geometry(
                  "MOBIUS FIELD", {}, 1.0, (320, 240), GeneratorSettings()
              )
              assert source_paths and target_paths
              interpolated_paths = interpolate_vector_paths(
                  source_paths, target_paths, 0.5
              )
              assert any(path["path_id"].startswith("morph:") for path in interpolated_paths)
              path_image = render_vector_paths(interpolated_paths, (320, 240))
              assert path_image.size == (320, 240)
              assert path_image.getchannel("A").getbbox() is not None

              anchor_source = {
                  "path_id": "source:curve", "group": "curve", "closed": False,
                  "points": [[0.0, 0.0], [0.5, 0.0], [1.0, 0.0]],
                  "width": 1.0, "color": [238, 238, 234], "alpha": 160,
              }
              anchor_target = {
                  "path_id": "target:curve", "group": "curve", "closed": False,
                  "points": [[0.0, 1.0], [0.5, 1.0], [1.0, 1.0]],
                  "width": 1.0, "color": [238, 238, 234], "alpha": 160,
              }
              anchored_paths = interpolate_vector_paths(
                  [anchor_source], [anchor_target], 0.5,
                  path_correspondence=[{
                      "source_path_ids": ["source:curve"],
                      "target_path_ids": ["target:curve"],
                      "mode": "pair",
                      "anchors": [
                          {"source_t": 0.0, "target_t": 0.0},
                          {"source_t": 0.5, "target_t": 0.25},
                          {"source_t": 1.0, "target_t": 1.0},
                      ],
                  }],
              )
              assert len(anchored_paths) == 1
              assert min(
                  ((point[0] - 0.375) ** 2 + (point[1] - 0.5) ** 2) ** 0.5
                  for point in anchored_paths[0]["points"]
              ) < 1e-6

              split_targets = [
                  {
                      **anchor_target, "path_id": f"target:split:{index}",
                      "points": [[0.0, 1.0], [0.5, 1.0 + index * 0.2], [1.0, 1.0]],
                  }
                  for index in range(2)
              ]
              split_map = [{
                  "source_path_ids": ["source:curve"],
                  "target_path_ids": ["target:split:0", "target:split:1"],
                  "mode": "split",
              }]
              split_paths_start = interpolate_vector_paths(
                  [anchor_source], split_targets, 0.0,
                  path_correspondence=split_map,
              )
              split_paths_mid = interpolate_vector_paths(
                  [anchor_source], split_targets, 0.5,
                  path_correspondence=split_map,
              )
              assert len(split_paths_start) == len(split_paths_mid) == 2
              assert all(item["correspondence_mode"] == "split" for item in split_paths_mid)
              assert all(abs(item["alpha"] - 80.0) < 1e-6 for item in split_paths_start)

              merge_sources = [
                  {
                      **anchor_source, "path_id": f"source:merge:{index}",
                      "points": [[0.0, index * 0.2], [0.5, index * 0.2], [1.0, index * 0.2]],
                  }
                  for index in range(2)
              ]
              merge_map = [{
                  "source_path_ids": ["source:merge:0", "source:merge:1"],
                  "target_path_ids": ["target:curve"],
                  "mode": "merge",
              }]
              merge_paths_end = interpolate_vector_paths(
                  merge_sources, [anchor_target], 1.0,
                  path_correspondence=merge_map,
              )
              assert len(merge_paths_end) == 2
              assert all(item["correspondence_mode"] == "merge" for item in merge_paths_end)
              assert all(abs(item["alpha"] - 80.0) < 1e-6 for item in merge_paths_end)
              assert merge_paths_end[0]["points"] == merge_paths_end[1]["points"]

              try:
                  interpolate_vector_paths(
                      [anchor_source], [anchor_target], 0.5,
                      path_correspondence=[{
                          "source_path_ids": ["missing:path"],
                          "target_path_ids": ["target:curve"],
                          "mode": "pair",
                      }],
                  )
                  raise AssertionError("Unknown authored path ID was accepted.")
              except ValueError as exc:
                  assert "unavailable path IDs" in str(exc)

              authored_transition = SceneTransition(
                  source_scene_id="author-source",
                  target_scene_id="author-target",
                  family="morph",
                  path_correspondence=[{
                      "source_object_id": "object-source",
                      "target_object_id": "object-target",
                      "source_path_ids": ["source:curve"],
                      "target_path_ids": ["target:curve"],
                  }],
              )
              assert authored_transition.object_correspondence[0]["kind"] == "path_map"
              assert authored_transition.sample(1.0)["path_correspondence"][0]["mode"] == "pair"
              authored_round_trip = SceneTransition.from_dict(authored_transition.to_dict())
              assert authored_round_trip.path_correspondence == authored_transition.path_correspondence
              try:
                  SceneTransition(
                      source_scene_id="author-source",
                      target_scene_id="author-target",
                      family="morph",
                      path_correspondence=[{
                          "source_object_id": "object-source",
                          "target_object_id": "object-target",
                          "source_path_ids": ["a"],
                          "target_path_ids": ["b"],
                          "anchors": [
                              {"source_t": 0.3, "target_t": 0.7},
                              {"source_t": 0.7, "target_t": 0.3},
                          ],
                      }],
                  )
                  raise AssertionError("Non-monotonic path anchors were accepted.")
              except ValueError as exc:
                  assert "strictly increasing" in str(exc)

              # Other future families retain lifecycle-only rendering and skip
              # the hidden incoming scene.
              hold_contract = ScenePairRenderContract.from_dict({
                  **pair_contract.to_dict(), "family": "erosion",
              })
              assert hold_contract.render_mode == "hold"
              assert blend_scene_pair_frames(
                  black, white, hold_contract
              ).getpixel((0, 0)) == (0, 0, 0, 255)
              rendered_scene_ids.clear()
              held_pair = pair_compositor.render_scene_pair(
                  packet={}, seconds=1.25, scene_pair=hold_contract
              )
              assert held_pair.getpixel((0, 0)) == (0, 0, 0, 255)
              assert rendered_scene_ids == ["pair-out"]
              cut_contract = ScenePairRenderContract.from_dict({
                  **pair_contract.to_dict(),
                  "family": "cut",
                  "incoming_weight": 0.0,
                  "outgoing_weight": 1.0,
                  "completed": False,
              })
              assert cut_contract.render_mode == "cut"
              assert blend_scene_pair_frames(
                  black, white, cut_contract
              ).getpixel((0, 0)) == (0, 0, 0, 255)
              cut_complete = ScenePairRenderContract.from_dict({
                  **cut_contract.to_dict(),
                  "incoming_weight": 1.0,
                  "outgoing_weight": 0.0,
                  "completed": True,
              })
              assert blend_scene_pair_frames(
                  black, white, cut_complete
              ).getpixel((0, 0)) == (255, 255, 255, 255)
              try:
                  ScenePairRenderContract.from_dict({
                      **pair_contract.to_dict(),
                      "incoming": {
                          **pair_contract.incoming,
                          "layers": [layers[0].to_dict()],
                      },
                  })
                  raise AssertionError("Shared scene-pair layer IDs were accepted.")
              except ValueError:
                  pass
          print("XM → score cues → multi-scene project → M14 scene-pair rendering: OK")
          PY
